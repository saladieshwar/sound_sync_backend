# Render Blueprint: the MusicPartner API (FastAPI + WebSockets) and its PostgreSQL database.
# The frontend is hosted on Vercel at https://musicpartner.vercel.app.
services:
  - type: web
    name: musicpartner-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # The free plan has no persistent disk, so the demo catalog's media is regenerated on every start.
    startCommand: >-
      alembic upgrade head &&
      python -m scripts.seed --catalog-only &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: MusicPartner API
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: musicpartner-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://musicpartner.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://musicpartner.vercel.app
      # The free plan's disk is wiped on restart, so with ENVIRONMENT=production uploads are kept in
      # the database (media_files). Optionally set this in the dashboard to use Cloudinary instead:
      # cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: musicpartner-db
    plan: free
    databaseName: musicpartner
    user: musicpartner
